# PostgreSQL para desenvolvimento e testes locais.
# O Next.js roda diretamente no computador (npm run dev); só o banco fica no container.
name: afinia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afinia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-afinia_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-afinia_test}
    ports:
      # Publicado apenas no loopback: inacessível a outras máquinas da rede.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - afinia-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  afinia-pgdata:
